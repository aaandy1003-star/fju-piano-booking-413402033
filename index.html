<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>輔仁大學 琴房借用系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body data-page="index">
  <div id="site-header"></div>

  <!-- ===== Banner ===== -->
  <section class="hero">
    <div class="hero-bg" aria-hidden="true">
      <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
      <div id="sparks"></div>
    </div>

    <div class="container hero-inner">
      <div class="hero-text">
        <p class="hero-en">Piano Room Booking</p>
        <h1>琴房借用系統</h1>
        <p class="hero-sub">輔仁大學・琴房線上借用</p>
      </div>

      <div class="hero-art">
        <div class="piano3d" aria-hidden="true">
          <div class="piano-body">
            <div class="pkeys" id="pianoKeys"></div>
          </div>
        </div>
        <div class="art-bubble" aria-hidden="true">預約成功 ✓</div>
        <a class="login-bubble" id="heroLogin" href="login.html">登入</a>
      </div>
    </div>

    <div class="container quick">
      <a href="#rooms"><span>🎹</span>預約琴房</a>
      <a href="rules.html"><span>📋</span>使用規範</a>
      <a href="login.html?next=booking.html" id="quickMine"><span>✏️</span>我的預約</a>
    </div>

    <svg class="hero-wave" viewBox="0 0 2880 60" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#f4f7fb" d="M0 30 C240 0 480 60 720 30 S1200 60 1440 30 S1920 60 2160 30 S2640 60 2880 30 V60 H0Z"/>
    </svg>
  </section>

  <main class="container home">
    <!-- ===== 公告跑馬燈 ===== -->
    <div class="marquee reveal" id="marquee" aria-label="最新公告" hidden>
      <span class="mq-label">📢 最新公告</span>
      <div class="mq-view"><div class="mq-track" id="mqTrack"></div></div>
    </div>

    <p class="welcome reveal">歡迎使用本系統。學生可直接查詢各琴房借用情形；教師與管理者請先登入後再進行預約。</p>

    <!-- ===== 狀態表 + 公告 ===== -->
    <div class="home-grid">
      <section class="panel reveal">
        <h2 class="panel-title"><span class="ico">📊</span>今日狀態
          <select id="statFloor" aria-label="依樓層篩選"></select>
        </h2>
        <table class="stat-table">
          <thead><tr><th>琴房名稱</th><th>今日開放</th><th>剩餘</th></tr></thead>
          <tbody id="statBody"></tbody>
        </table>
        <div class="pager">
          <button id="pgPrev" aria-label="上一頁">‹</button>
          <span id="pageInfo"></span>
          <button id="pgNext" aria-label="下一頁">›</button>
        </div>
      </section>

      <section class="panel reveal">
        <h2 class="panel-title"><span class="ico">💬</span>訊息公告</h2>
        <table class="news-table">
          <thead><tr><th>標題</th><th>公告日期</th></tr></thead>
          <tbody id="newsBody"></tbody>
        </table>
      </section>
    </div>

    <!-- ===== 琴房卡片牆 ===== -->
    <section id="rooms" class="rooms-sec reveal">
      <h2 class="sec-title">選擇琴房</h2>
      <div class="filters" id="filters"></div>
      <div class="room-grid" id="roomGrid"></div>
    </section>

    <!-- ===== 琴房使用一覽表 ===== -->
    <section id="schedule" class="reveal">
      <h2 class="sec-title">琴房使用一覽表</h2>
      <div class="toolbar card">
        <div class="field-inline">
          <label for="roomSelect">琴房</label>
          <select id="roomSelect"></select>
        </div>
        <div class="week-nav">
          <button class="btn btn-ghost btn-sm" id="prevWeek">‹ 上一週</button>
          <button class="btn btn-ghost btn-sm" id="todayBtn">本週</button>
          <button class="btn btn-ghost btn-sm" id="nextWeek">下一週 ›</button>
          <input type="text" id="jumpDate" placeholder="跳到指定日期" autocomplete="off" aria-label="跳到指定日期所在週">
        </div>
        <div class="week-label" id="weekLabel"></div>
      </div>

      <div class="room-info" id="roomInfo"></div>

      <div class="legend">
        <span><i class="dot free"></i>可預約</span>
        <span><i class="dot booked"></i>已被借用</span>
        <span><i class="dot mine"></i>我的預約</span>
        <span><i class="dot past"></i>已過期</span>
        <span><i class="dot closed"></i>不開放</span>
      </div>

      <div class="card grid-wrap"><div id="scheduleGrid"></div></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>
  <script src="js/config.js"></script>
  <script src="data/mock.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/booking-form.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
