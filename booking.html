<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>預約管理｜輔仁大學 琴房借用系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body data-page="booking">
  <div id="site-header"></div>

  <main class="container page">
    <section class="page-head">
      <h1>預約管理</h1>
      <p>新增、編輯或刪除琴房預約。教師僅能管理自己的預約，管理者可管理全部。</p>
    </section>

    <div class="toolbar card">
      <button class="btn btn-primary" id="newBtn">＋ 新增預約</button>
      <div class="field-inline">
        <label for="roomFilter">琴房</label>
        <select id="roomFilter"><option value="">全部琴房</option></select>
      </div>
      <label class="check"><input type="checkbox" id="showPast"> 顯示過去紀錄</label>
    </div>

    <div class="card table-card">
      <div id="bookingList"></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>
  <script src="js/config.js"></script>
  <script src="data/mock.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/booking-form.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
